:root{--cream:#FBF6F0;--sand:#EADBC8;--espresso:#3A3026;--ink:#63594F;--terracotta:#BF8560;--gold:#E3B266;--olive:#7B8C58;--olive-deep:#5B6A3F}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--espresso);color:var(--cream);font-family:'Assistant',Arial,sans-serif;overflow:hidden}
button{font-family:inherit;font-size:1rem}

/* סרגל הכלים */
#bar{position:fixed;top:0;right:0;left:0;z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:.6rem 1rem;padding:.6rem 1rem;background:rgba(58,48,38,.94);border-bottom:1px solid rgba(234,219,200,.18);transition:opacity .4s}
#bar.hidden{opacity:0;pointer-events:none}
#bar h1{font-family:'Amatic SC',cursive;font-weight:700;font-size:2.2rem;margin:0 .4rem 0 0;color:var(--gold);letter-spacing:.02em}
.grp{display:flex;align-items:center;gap:.4rem;font-size:.95rem;color:var(--sand)}
.grp input[type=range]{width:120px;accent-color:var(--gold)}
.btn{border:1px solid var(--sand);background:transparent;color:var(--cream);border-radius:999px;padding:.4rem 1rem;cursor:pointer}
.btn:hover{background:rgba(234,219,200,.12)}
.btn.main{background:var(--gold);color:var(--espresso);border-color:var(--gold);font-weight:700;font-size:1.05rem;padding:.45rem 1.3rem}
.btn.rec{border-color:#C96A5A;color:#F2B9AE}
.btn.rec.on{background:#C96A5A;color:#fff;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.6}}
#clock{font-variant-numeric:tabular-nums;font-size:1.3rem;color:var(--gold);min-width:4.5rem;text-align:center}
.spacer{flex:1}
select{font-family:inherit;font-size:.95rem;background:var(--espresso);color:var(--cream);border:1px solid var(--sand);border-radius:999px;padding:.4rem .8rem;max-width:22rem}
#cam{position:fixed;z-index:4;right:1rem;bottom:1rem;width:min(26vw,300px);border-radius:1rem;border:2px solid var(--gold);transform:scaleX(-1);background:#000;display:none}
#cam.on{display:block}
#cam.full{right:0;left:0;top:0;bottom:0;width:100%;height:100%;border:0;border-radius:0;object-fit:cover;opacity:.30;z-index:1}
.hint{font-size:.85rem;color:rgba(234,219,200,.55)}

/* קו הקריאה */
#guide{position:fixed;right:0;left:0;top:33%;z-index:5;pointer-events:none}
#guide:before,#guide:after{content:"";position:absolute;top:-10px;border:10px solid transparent}
#guide:before{right:8px;border-right-color:var(--gold)}
#guide:after{left:8px;border-left-color:var(--gold)}
#guide span{position:absolute;right:0;left:0;top:0;border-top:1px dashed rgba(227,178,102,.35)}

/* הטקסט */
#stage{position:absolute;inset:0;overflow:hidden;cursor:pointer}
#scroll{position:absolute;right:0;left:0;top:0;padding:33vh 8vw 60vh;will-change:transform;text-align:center}
#scroll p{margin:0 0 .9em;line-height:1.5;font-weight:600;text-wrap:balance}
#scroll .cue{display:block;font-size:.42em;color:var(--terracotta);margin:0 0 .3em;font-weight:600;letter-spacing:.02em}
#scroll .cue.off{display:none}
#scroll p.done{opacity:.35}
#scroll p.end{color:var(--gold);font-family:'Amatic SC',cursive;font-size:1.6em}

/* ספירה לאחור */
#count{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:30;background:rgba(58,48,38,.85);font-family:'Amatic SC',cursive;font-size:22vmin;color:var(--gold)}
#count.on{display:flex}

/* עריכה */
#edit{position:fixed;inset:0;z-index:40;display:none;background:var(--espresso);padding:1rem;flex-direction:column;gap:.8rem}
#edit.on{display:flex}
#edit h2{font-family:'Amatic SC',cursive;font-size:2.4rem;color:var(--gold);margin:0}
#edit p{margin:0;color:var(--sand);font-size:1rem}
#edit textarea{flex:1;width:100%;font-family:'Assistant',Arial,sans-serif;font-size:1.35rem;line-height:1.5;background:#2C241C;color:var(--cream);border:1px solid var(--ink);border-radius:14px;padding:1rem;resize:none;direction:rtl}
#edit .row{display:flex;gap:.6rem;flex-wrap:wrap}

/* הודעה */
/* טלפון. ⚠️ נבדק בצילום מסך ב-412 פיקסלים: הסרגל המלא גולש ודוחף את הטקסט
   מחוץ למסך, ולכן כאן מורידים את הכותרת, את הרמז ואת "להתחלה", ומצמצמים הכל. */
@media (max-width:820px){
  #bar{gap:.35rem .45rem;padding:.4rem .5rem}
  #bar h1{display:none}
  .hint{display:none}
  .spacer{display:none}
  #top{display:none}
  .grp{font-size:.82rem;gap:.25rem}
  .grp input[type=range]{width:60px}
  .btn{padding:.3rem .6rem;font-size:.85rem}
  .btn.main{font-size:.9rem;padding:.35rem .85rem}
  select{max-width:9.5rem;font-size:.8rem;padding:.28rem .55rem}
  #clock{font-size:1rem;min-width:2.8rem}
  #cam{width:38vw}
  #scroll{padding-left:14px;padding-right:14px}
  #scroll p{overflow-wrap:anywhere}
}
#toast{position:fixed;bottom:1.2rem;right:50%;transform:translateX(50%);background:var(--olive-deep);color:var(--cream);padding:.7rem 1.3rem;border-radius:999px;font-size:1.05rem;z-index:50;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1}
</style>
</head>
<body>

<div id="bar">
  <h1>טלפרומפטר</h1>
  <select id="pick" title="בחירת תסריט"></select>
  <button class="btn main" id="play" title="רווח">▶ התחלה</button>
  <button class="btn" id="top" title="Home">⤒ להתחלה</button>
  <div id="clock">0:00</div>
  <div class="grp">מהירות <input type="range" id="speed" min="8" max="120" value="32"><span id="speedv">32</span></div>
  <div class="grp">גודל <input type="range" id="size" min="34" max="120" value="66"><span id="sizev">66</span></div>
  <label class="grp"><input type="checkbox" id="cues" checked> מה רואים</label>
  <label class="grp"><input type="checkbox" id="mirror"> מראה</label>
  <div class="spacer"></div>
  <button class="btn rec" id="rec">● הקלטת קול</button>
  <button class="btn rec" id="recv">● הקלטת וידאו</button>
  <button class="btn" id="editbtn">✎ טקסט</button>
  <span class="hint">רווח = התחלה/עצירה · חצים = מהירות · הקשה על הטקסט = עצירה</span>
</div>

<video id="cam" autoplay muted playsinline></video>

<div id="guide"><span></span></div>

<div id="stage"><div id="scroll"></div></div>

<div id="count"></div>

<div id="edit">
  <h2>הטקסט להקראה</h2>
  <p>שורה ריקה מפרידה בין קטעים. שורה שמתחילה ב-<b>#</b> היא "מה רואים" ולא נקראת בקול. הטקסט נשמר בדפדפן הזה.</p>
  <textarea id="ta" spellcheck="false"></textarea>
  <div class="row">
    <button class="btn main" id="save">שמירה וחזרה</button>
    <button class="btn" id="cancel">ביטול</button>
    <button class="btn" id="reset">חזרה לתסריט המקורי</button>
  </div>
</div>

const SCRIPTS = [{"id": "00-פטרת-ציפורניים", "title": "פטרת ציפורניים", "secs": 51, "words": 81, "pending": false, "text": "# שרה מדברת\nהיא הייתה בטוחה שפטרת זה משהו של מבוגרים.\n\n# רגל ימין, לפני\nבת עשרים וחמש, עם פטרת בציפורניים. הייתה בטוחה שפטרת זה משהו רק של מבוגרים, ושזה פשוט נשאר ככה.\n\n# שיוף\nבטיפול הראשון אני משייפת ומדללת את הציפורן, ומורידה את השכבה הפגועה.\n\n# אותה רגל, אחרי\nוזה כבר אחרי הביקור הראשון. בהמשך נעבור לפוטותרפיה, כדי להמשיך לנקות מבפנים.\n\n# שרה מדברת\nפטרת לא בוחרת גיל, והיא לא נשארת לנצח. גם אם היא איתך כבר שנים, אפשר לטפל בזה.\n\n# סיום\nרוצה לדעת אם זה מתאים גם לך? תכתב/י לי פטרת בתגובות ואני שולחת את הפרטים.\n"}, {"id": "01-חודרנית-בבית-לבד", "title": "חודרנית בבית לבד", "secs": 52, "words": 84, "pending": false, "text": "# ההוק · הפריים הראשון הוא הקלוז-אפ של הידיים\nחוט דנטלי מתחת לציפורן. אני יודעת, גם את ראית את הסרטון הזה.\n\n# הגוף · את מדברת\nאני מבינה למה מנסים בבית. זה כואב, זה מביך, ולא בא לך לעשות מזה עניין.\n\n# ההוצאה עצמה\nהבעיה היא שכל חיטוט בבית דוחף את הציפורן עמוק יותר, ומה שהיה שבוע נהיה חודשיים.\n\n# ממשיכים על ההוצאה\nאצלי זה נראה ככה: מוציאים את הפינה משפת הציפורן, מנקים, ומיישרים.\n\n# את, שוב\nואם ניסית לבד וזה החמיר, זה לא סימן שלא ניסית מספיק. זה סימן שהגיע הזמן שמישהי תעזור לך.\n\n# ה-CTA · שקף הסיום\nיש לך ציפורן אחת כזאת? כתבי לי חודרנית בתגובות ואני שולחת לך פרטים.\n"}, {"id": "02-בלי-סכין", "title": "בלי סכין", "secs": 56, "words": 89, "pending": false, "text": "# ✅ שרה, 14/09: לא עובדת עם סכין. ⛔ לא לנסח \"לפעמים כן\", אף אחד כבר לא עובד עם סכין\n# ההוק · הפריים הראשון הוא המגש מלמעלה\nמחפשת מישהי שלא עובדת עם סכין? בואי תראי עם מה אני כן עובדת.\n\n# המגש\nהרבה נשים כותבות: מחפשת מישהי שלא עובדת עם סכין. אני מבינה את הפחד. זו רגל, זה רגיש, ומישהי זרה נוגעת בה.\n\n# המקדחה\nאז ככה זה נראה אצלי. ראש שיוף קטן שמדלל לאט, ואת מרגישה בעיקר רטט.\n\n# הניפר\nכלי קטן לשפת הציפורן, בלי משיכות.\n\n# מנורת ההגדלה\nומנורה שמגדילה, כי אני רוצה לראות בדיוק ולא לנחש.\n\n# חזרה למגש\nהכלים לא כאן כדי להפחיד. הם כאן כדי שתצאי רגועה יותר משנכנסת.\n\n# ה-CTA · שקף הסיום\nרוצה לדעת איך נראה טיפול אצלי? כתבי לי פדיקור בתגובות ואני שולחת לך פרטים.\n"}, {"id": "03-בלי-נעליים-פתוחות", "title": "בלי נעליים פתוחות", "secs": 36, "words": 58, "pending": false, "text": "# ההוק · את למצלמה, בלי כותרת על הפנים\nהיא לא נעלה נעל פתוחה כבר שנים.\n\n# ממשיכה\nלא לים, לא לבריכה, ובחיים לא יחפה בבית של מישהו אחר.\n\n# הרגע\nלא בגלל שכאב לה. בגלל שהיא התביישה.\n\n# העידוד\nהיא עשתה פוטותרפיה, וזה השתנה. ואם זו את, תדעי: גם אם זה איתך כבר שנים, אפשר לטפל בזה.\n\n# ה-CTA · שקף הסיום\nיש נעל שאת לא נועלת כבר שנים? כתבי לי פטרת בתגובות ואני שולחת לך פרטים.\n"}, {"id": "04-חומץ-שום-ועץ-התה", "title": "חומץ שום ועץ התה", "secs": 52, "words": 84, "pending": false, "text": "# ההוק · את, והמשפט על המסך. בלי אביזרים · פנייה בזכר\nחומץ על הפטרת. אני יודעת, גם לך אמרו.\n\n# את מדברת\nאני מבינה למה מנסים. זה בבית, זה זול, ואף אחד לא צריך לדעת.\n\n# שיוף\nהבעיה היא שהפטרת יושבת מתחת לציפורן, בעומק, ומה שמורחים מלמעלה כמעט לא מגיע לשם.\n\n# ממשיכים על השיוף\nבגלל זה אצלי הטיפול מתחיל בדיקוק הציפורן, כדי לפתוח דרך.\n\n# מכשיר הפוטותרפיה\nואז כשצריך פוטותרפיה, אור שעובד על הפטרייה עצמה.\n\n# את, שוב\nואם ניסית חומץ שנה שלמה, לא בזבזת שנה. עכשיו אתה יודע משהו שהרבה אנשים עוד לא יודעים.\n\n# ה-CTA · שקף הסיום\nיש לך ציפורן אחת עם פטרת? כתוב לי פטרת בתגובות ואני שולחת לך פרטים.\n"}, {"id": "05-מי-קבע-לך-את-התור", "title": "מי קבע לך את התור", "secs": 48, "words": 76, "pending": false, "text": "# ✅ שרה, 14/09: נכון, לא כולם, אבל זה קורה הרבה. ⛔ לא לומר שלא אכפת להם\n# ההוק · את למצלמה, פונה בזכר\nאשתך קבעה לך תור אליי? אתה לא הראשון. ואתה לא תהיה האחרון.\n\n# את מדברת\nהיא רואה את זה כבר חודשים. אתה אומר שזה כלום. ואז היא קובעת, ואתה מגיע, קצת בלי חשק.\n\n# קלוז-אפ ידיים, ארבע שניות\nאצלי אין מראה של סלון יופי ואין מי שמסתכל.\n\n# חזרה אלייך\nיש כורסה, מנורה, ומישהי שמטפלת בציפורן שהציקה לך יותר מדי זמן.\n\n# העידוד · שרה בחרה את המשפט הזה, 14/09\nואם היא קבעה לך, תבוא. בוא פעם אחת, ותראה שזה לא עניין גדול.\n\n# ה-CTA · שקף הסיום\nמישהי קבעה לך את התור? כתוב לי פדיקור בתגובות ואני שולחת לך פרטים.\n"}, {"id": "06-שלושה-דברים", "title": "שלושה דברים", "secs": 54, "words": 87, "pending": false, "text": "# ההוק · את, והספרה 1 גדולה על המסך\nשלושה דברים שאני לא עושה לרגליים של עצמי. את מספר שתיים כמעט כולם עושים.\n\n# 1 על המסך\nאחת: אני לא מעגלת את הפינות של הציפורן. גוזרים ישר, והפינה נשארת מעל העור. ככה ציפורן לא נכנסת.\n\n# 2 על המסך\nשתיים: אני לא גוזרת קצר מדי. ציפורן קצרה נראית נקייה, אבל העור מלפנים עולה עליה, וזה בדיוק הפתח לחודרנית.\n\n# 3 על המסך\nשלוש: אני לא מורחת לק על ציפורן שהשתנה לה הצבע. לק מסתיר, לא מטפל, ומה שמתחתיו ממשיך.\n\n# העידוד\nאם עשית אחד מהשלושה, תירגעי. כולם עושים. עכשיו את יודעת.\n\n# ה-CTA · שקף הסיום\nשמרי את הסרטון, שיהיה לך לפעם הבאה שאת גוזרת.\n"}, {"id": "07-זה-כואב", "title": "זה כואב", "secs": 51, "words": 82, "pending": false, "text": "# ההוק · טיים-לאפס של הטיפול המלא, ו\"פרק 1\" על המסך · פנייה בזכר\nהשאלה ששואלים אותי לפני כל טיפול ראשון: זה כואב?\n\n# הטיים-לאפס ממשיך\nהאמת? לפעמים יש רגע לא נעים, ואני אומרת לך לפני שהוא מגיע. אבל רוב הטיפול נראה ככה.\n\n# עצירה בזמן אמת · המנורה\nקודם מסתכלים, עם מנורה, כי אני רוצה לראות ולא לנחש.\n\n# עצירה בזמן אמת · המקדחה\nאחר כך מדללים לאט.\n\n# עצירה בזמן אמת · הניפר\nואז מנקים את שפת הציפורן.\n\n# חזרה לטיים-לאפס\nאין הפתעות, ואתה יכול לעצור אותי בכל רגע. רוב האנשים יוצאים רגועים יותר משנכנסו, וזה לא במקרה. הרוגע אצלי הוא חלק מהטיפול.\n\n# ה-CTA · שקף הסיום\nרוצה לדעת מה קורה בטיפול ראשון אצלך? כתוב לי טיפול בתגובות ואני שולחת לך פרטים.\n"}, {"id": "08-ההורה", "title": "ההורה", "secs": 63, "words": 101, "pending": false, "text": "# צריך צילום חדש: שתי דקות בטלפון לפני ביקור הבית הבא, בלי המטופל\n# ההוק · התיק נסגר, הדלת של הרכב\nאמא שלך כבר לא מגיעה לרגליים שלה. היא פשוט לא תגיד לך.\n\n# המדרגות, הדלת\nבגיל מסוים הגב לא מתכופף, העיניים לא רואות את הציפורן, והידיים כבר לא בטוחות. ואז מגיע הרגע שהבת שמה לב.\n\n# הידיים מוציאות את המנורה\nאני מגיעה עד הבית, עם התיק, עם המנורה, ועם זמן.\n\n# התיק · ✅ שרה, 14/09: היא בודקת את כל כף הרגל אצל כולם, לא רק אצל סוכרתיים\nבודקת את כל כף הרגל, לא רק ציפורניים. בין האצבעות, העקבים, שאין סדק ואין פצע. אצל כולם, ואצל מי שיש לו סוכרת עוד יותר. ואם אני מוצאת משהו, אני אומרת.\n\n# העידוד\nההורים שלך טיפלו ברגליים שלך שנים. עכשיו תורך, ואת לא צריכה לעשות את זה לבד.\n\n# ה-CTA · שקף הסיום\nיש הורה שאת דואגת לרגליים שלו? כתבי לי ביקור בתגובות ואני שולחת לך פרטים.\n"}, {"id": "10-יבלת-שורש", "title": "יבלת שורש", "secs": 52, "words": 84, "pending": false, "text": "# ההוק · קלוז-אפ של היבלת, עם המשפט · פנייה בזכר\nליבלת שורש אין שורש.\n\n# הקלוז-אפ ממשיך\nיבלת ויראלית, מה שנקרא יבלת שורש, זה וירוס שנכנס דרך סדק קטן בעור, בדרך כלל במקלחת ציבורית או בבריכה.\n\n# ממשיכים\nאין לה שורש, אבל יש לה נטייה לחזור, בעיקר כשגוזרים אותה בבית.\n\n# שני הסימנים המבדילים\nההבדל מעור קשה: יבלת כואבת כשלוחצים מהצדדים, ויש בה נקודות שחורות קטנות.\n\n# עט הפלזמה\nאצלי מטפלים בה עם עט פלזמה, נקודתית, על היבלת בלבד.\n\n# לפני ואחרי של היבלת\nואם היא חוזרת אליך כבר שנה, זה לא בגללך. ככה היא. אפשר לטפל בזה.\n\n# ה-CTA · שקף הסיום\nיש לך אחת כזאת שחוזרת? כתוב לי יבלת בתגובות ואני שולחת לך פרטים.\n"}, {"id": "11-כמה-זמן-זה-לוקח", "title": "כמה זמן זה לוקח", "secs": 54, "words": 87, "pending": true, "text": "# ✅ שרה אישרה 14/09 · ⚠️ נשאר: כמה זמן טיפול ראשון באמת לוקח\n# ההוק · טיים-לאפס של הטיפול, ו\"פרק 2\" על המסך · פנייה בזכר\nהשאלה השנייה ששואלים אותי לפני טיפול ראשון: כמה זמן זה לוקח?\n\n# טיים-לאפס ממשיך\nבוא נעשה את זה פשוט. הטיפול עצמו לוקח בערך עשרים דקות.\n\n# עצירה בזמן אמת · המנורה\nטיפול ראשון הוא הארוך יותר, כי בו אני מסתכלת על הכל לפני שאני נוגעת.\n\n# עצירה בזמן אמת · המקדחה\nואחרי הראשון, הבאים קצרים יותר.\n\n# את למצלמה\nלא צריך להביא כלום, ולא צריך להתכונן. אתה יושב, אני עובדת, ואתה יכול לעצור אותי בכל רגע.\n\n# העידוד\nואם דחית את זה שנתיים, אתה לא היחיד. רוב האנשים מגיעים מאוחר, וזה בסדר גמור.\n\n# ה-CTA · שקף הסיום\nרוצה לדעת כמה זמן ייקח אצלך? כתוב לי טיפול בתגובות ואני שולחת לך פרטים.\n"}, {"id": "12-למה-החודרנית-חוזרת", "title": "למה החודרנית חוזרת", "secs": 51, "words": 81, "pending": true, "text": "# ✅ שרה אישרה 14/09 · ⛔ עולם החודרנית בלבד, בלי פטרת ובלי יבלת\n# ההוק · קלוז-אפ הוצאה משפת הציפורן (133619) · פנייה בנקבה\nהוצאתי לך את החודרנית, ואני רוצה שלא תחזרי אליי איתה.\n\n# ההוצאה ממשיכה\nהחודרנית חוזרת כשהפינה של הציפורן ממשיכה ללחוץ על העור.\n\n# את למצלמה\nאז אחרי שמוציאים אותה, מה שקובע זה איך גוזרים הלאה.\n\n# קלוז-אפ ציפורן גזורה ישר\nגוזרים ישר, לא מעגלים את הפינות, ולא קצר מדי.\n\n# ⚠️ לאשר: זה הפתרון שאת מציעה כשהציפורן עצמה מעוקלת?\nואם הציפורן עצמה מעוקלת, יש גם פתרון שמיישר אותה לאורך זמן.\n\n# העידוד\nואם היא חזרה אלייך פעם ופעמיים, זה לא סימן שאת עושה משהו לא בסדר. זה סימן שהיא צריכה משהו נוסף.\n\n# ה-CTA · שקף הסיום\nיש לך אחת שחוזרת? כתבי לי חודרנית בתגובות ואני שולחת לך פרטים.\n"}, {"id": "13-הרופא-רצה-לתת-כדורים", "title": "הרופא רצה לתת כדורים", "secs": 55, "words": 88, "pending": true, "text": "# ✅ שרה אישרה 14/09 · ⛔ עולם הפטרת בלבד. ⚠️ לא נכנסים להחלטה רפואית\n# ההוק · את למצלמה, בלי אביזרים · פנייה בנקבה\nהרופא הציע לך כדורים לפטרת, ואת מתלבטת. אני לא אחליט במקומך.\n\n# את ממשיכה\nאני לא רופאה, ואני לא נכנסת להחלטה על תרופות.\n\n# שיוף (133202)\nמה שאני כן עושה זה החלק שקורה על הציפורן עצמה. מדקקת אותה, כדי לפתוח דרך.\n\n# מנורת הפוטותרפיה\nואז כשצריך פוטותרפיה, אור שעובד על הפטרייה.\n\n# חזרה אלייך\nיש מי שמגיעה אליי לפני שהחליטה, ויש מי שמגיעה במקביל, ושתיהן בסדר.\n\n# העידוד\nואם את מתלבטת כבר חודשים, זה לא בגלל שאת לא מחליטה. זה בגלל שאף אחד לא הסביר לך מה האפשרויות.\n\n# ה-CTA · שקף הסיום\nיש לך ציפורן אחת עם פטרת? כתבי לי פטרת בתגובות ואני שולחת לך פרטים.\n"}, {"id": "14-סדקים-בעקבים", "title": "סדקים בעקבים", "secs": 50, "words": 80, "pending": true, "text": "# ✅ שרה אישרה 14/09 · ⚠️ אין שוט של טיפול בעקב במחסן, צריך לצלם\n# ⛔ עולם העקב בלבד. ⛔ בלי קרם, זה עולם נפרד\n# ההוק · את למצלמה, או קלוז-אפ עקב · פנייה בנקבה\nהעקב לא נסדק כי הוא יבש. הוא נסדק כי הוא לחוץ.\n\n# ⚠️ לאשר את ההסבר המקצועי · קלוז-אפ העור סביב הסדק\nהעור סביב הסדק נעשה קשה ועבה, והוא כבר לא זז.\n\n# ממשיכים על הקלוז-אפ\nואז בכל צעד הלחץ נפתח בדיוק באותו מקום.\n\n# ⚠️ שוט חדש שצריך לצלם · הורדת העור הקשה סביב הסדק\nאז מה שאני עושה זה להוריד את העור הקשה סביב הסדק, בעדינות, עד שהעקב חוזר להיות גמיש.\n\n# העידוד\nואם מרחת שנה שלמה וזה לא נסגר, זה לא שלא ניסית מספיק. זה שהשכבה הקשה מעל לא נתנה לזה הזדמנות.\n\n# ה-CTA · שקף הסיום\nיש לך סדק שחוזר כל קיץ? כתבי לי עקבים בתגובות ואני שולחת לך פרטים.\n"}];
const LS_PICK = 'sarah-prompter-pick-v2';
const lsKey = id => 'sarah-prompter-script-v2:' + id;
const $ = id => document.getElementById(id);
let cur = SCRIPTS[0];
const scroll = $('scroll'), stage = $('stage'), bar = $('bar');

let y = 0, running = false, last = 0, elapsed = 0, raf = 0, hideTimer = 0;

function getScript(){ try{ return localStorage.getItem(lsKey(cur.id)) || cur.text }catch(e){ return cur.text } }
function buildPicker(){
  const sel = $('pick');
  sel.innerHTML = SCRIPTS.map((s,i)=>
    `<option value="${i}">${s.pending?'⚠️ ':''}${s.title} · כ-${s.secs}ש׳</option>`).join('');
  let saved = 0; try{ saved = +(localStorage.getItem(LS_PICK)||0) }catch(e){}
  if(!SCRIPTS[saved]) saved = 0;
  sel.value = saved; cur = SCRIPTS[saved];
}
function render(){
  const blocks = getScript().replace(/\r/g,'').split(/\n\s*\n/);
  scroll.innerHTML = '';
  for(const b of blocks){
    const lines = b.split('\n');
    const cues = lines.filter(l=>l.trim().startsWith('#')).map(l=>l.replace(/^\s*#\s*/,'').trim());
    const text = lines.filter(l=>!l.trim().startsWith('#')).join(' ').trim();
    if(!text) continue;
    const p = document.createElement('p');
    if(cues.length){ const c=document.createElement('span'); c.className='cue'+($('cues').checked?'':' off'); c.textContent=cues.join(' · '); p.appendChild(c); }
    p.appendChild(document.createTextNode(text));
    scroll.appendChild(p);
  }
  const end = document.createElement('p'); end.className='end'; end.textContent='סוף'; scroll.appendChild(end);
  applySize();
}
function applySize(){ scroll.style.fontSize = $('size').value+'px'; $('sizev').textContent=$('size').value; }
function place(){ const flip = $('mirror').checked ? ' scaleX(-1)' : ''; scroll.style.transform = `translateY(${-y}px)${flip}`; }
function fmt(s){ s=Math.floor(s); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function markDone(){
  const line = window.innerHeight*0.33;
  for(const p of scroll.querySelectorAll('p')){ const r=p.getBoundingClientRect(); p.classList.toggle('done', r.bottom < line-10); }
}
function tick(t){
  if(!running) return;
  const dt = (t-last)/1000; last=t;
  y += parseFloat($('speed').value)*dt;
  elapsed += dt;
  const max = scroll.scrollHeight - window.innerHeight*0.33;
  if(y>=max){ y=max; stop(true); }
  place(); markDone();
  $('clock').textContent = fmt(elapsed);
  raf = requestAnimationFrame(tick);
}
function start(){
  if(running) return;
  countdown(3, ()=>{ running=true; last=performance.now(); $('play').textContent='❚❚ עצירה'; raf=requestAnimationFrame(tick); autoHide(); });
}
function stop(finished){
  running=false; cancelAnimationFrame(raf); $('play').textContent='▶ המשך'; showBar();
  if(finished){ toast('סוף הטקסט · '+fmt(elapsed)); if(recorder && recorder.state==='recording') recorder.stop(); }
}
function toggle(){ running ? stop(false) : start(); }
function toTop(){ stop(false); y=0; elapsed=0; place(); markDone(); $('clock').textContent='0:00'; $('play').textContent='▶ התחלה'; }
function countdown(n, done){
  const c=$('count'); c.classList.add('on');
  const step=()=>{ if(n===0){ c.classList.remove('on'); done(); return; } c.textContent=n; n--; setTimeout(step,800); };
  step();
}
function showBar(){ bar.classList.remove('hidden'); clearTimeout(hideTimer); }
function autoHide(){ clearTimeout(hideTimer); hideTimer=setTimeout(()=>{ if(running) bar.classList.add('hidden'); }, 2500); }
function toast(msg, ms=3500){ const t=$('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'), ms); }

/* הקלטה · קול בלבד או קול+וידאו.
   ⚠️ הדפדפן שומר webm. להמרה: ffmpeg -i x.webm -c:v libx264 -crf 18 x.mp4
   ⚠️ גישה למצלמה ולמיקרופון עובדת בכרום מקובץ מקומי ומכתובת https, ⛔ לא מ-http רגיל. */
let recorder=null, chunks=[], recStart=0, recKind='audio', mediaStream=null;
const AUDIO_WANTED = {echoCancellation:false, noiseSuppression:false, autoGainControl:false};

function recBtn(){ return recKind==='video' ? $('recv') : $('rec'); }
function recLabel(on){
  if(on) return '■ סיום הקלטה';
  return recKind==='video' ? '● הקלטת וידאו' : '● הקלטת קול';
}

async function toggleRec(kind){
  if(recorder && recorder.state==='recording'){ recorder.stop(); return; }
  recKind = kind==='video' ? 'video' : 'audio';
  const wantVideo = recKind==='video';
  try{
    mediaStream = await navigator.mediaDevices.getUserMedia(wantVideo
      ? {audio:AUDIO_WANTED, video:{facingMode:'user', width:{ideal:1080}, height:{ideal:1920}}}
      : {audio:AUDIO_WANTED});
    const types = wantVideo
      ? ['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm','video/mp4']
      : ['audio/webm;codecs=opus','audio/webm'];
    const mime = types.find(t=>MediaRecorder.isTypeSupported(t)) || '';
    const opts = mime ? {mimeType:mime} : {};
    if(wantVideo){ opts.videoBitsPerSecond = 8000000; opts.audioBitsPerSecond = 128000; }
    else { opts.audioBitsPerSecond = 128000; }
    recorder = new MediaRecorder(mediaStream, opts);
    chunks=[]; recStart=Date.now();
    if(wantVideo){ $('cam').srcObject = mediaStream; $('cam').classList.add('on'); }
    recorder.ondataavailable = e=>{ if(e.data.size) chunks.push(e.data); };
    recorder.onstop = ()=>{
      mediaStream.getTracks().forEach(t=>t.stop());
      $('cam').classList.remove('on','full'); $('cam').srcObject = null;
      const ext = (recorder.mimeType||'').includes('mp4') ? 'mp4' : 'webm';
      const blob = new Blob(chunks,{type: recorder.mimeType || (wantVideo?'video/webm':'audio/webm')});
      const d=new Date(), pad=n=>String(n).padStart(2,'0');
      const what = wantVideo ? 'וידאו' : 'קול';
      const name = `${what} - ${cur.title} - ${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()} ${pad(d.getHours())}.${pad(d.getMinutes())}.${ext}`;
      const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove();
      recBtn().classList.remove('on'); recBtn().textContent=recLabel(false);
      toast('נשמר בהורדות: '+name+' · '+fmt((Date.now()-recStart)/1000), 8000);
    };
    recorder.start(1000);
    recBtn().classList.add('on'); recBtn().textContent=recLabel(true);
    toast(wantVideo
      ? 'מקליטה וידאו. הקשה על התצוגה הקטנה פורשת אותה מאחורי הטקסט, כדי שתסתכלי למצלמה. רווח להתחלת הטקסט.'
      : 'מקליטה. רווח להתחלת הטקסט.', 8000);
  }catch(e){
    toast(wantVideo
      ? 'אין גישה למצלמה בדפדפן הזה. אפשר לצלם בטלפון מול המסך במקום.'
      : 'אין גישה למיקרופון בדפדפן הזה. אפשר להקליט בטלפון במקום.', 6000);
  }
}

/* אירועים */
$('play').onclick=toggle; $('top').onclick=toTop;
$('rec').onclick=()=>toggleRec('audio'); $('recv').onclick=()=>toggleRec('video');
$('cam').onclick=()=>$('cam').classList.toggle('full');
stage.onclick=()=>{ if(running) stop(false); else start(); };
$('speed').oninput=e=>{ $('speedv').textContent=e.target.value; };
$('size').oninput=()=>{ applySize(); place(); markDone(); };
$('cues').onchange=()=>{ scroll.querySelectorAll('.cue').forEach(c=>c.classList.toggle('off', !$('cues').checked)); };
$('mirror').onchange=place;
$('editbtn').onclick=()=>{ stop(false); $('ta').value=getScript(); $('edit').classList.add('on'); };
$('cancel').onclick=()=>$('edit').classList.remove('on');
$('save').onclick=()=>{ try{ localStorage.setItem(lsKey(cur.id),$('ta').value) }catch(e){} $('edit').classList.remove('on'); render(); toTop(); toast('הטקסט נשמר'); };
$('reset').onclick=()=>{ $('ta').value=cur.text; try{ localStorage.removeItem(lsKey(cur.id)) }catch(e){} };
$('pick').onchange=e=>{ cur=SCRIPTS[+e.target.value]; try{ localStorage.setItem(LS_PICK,e.target.value) }catch(e){}
  render(); toTop(); if(cur.pending) toast('⚠️ בתסריט הזה יש שורה שממתינה לך. ראי את שורות ה-# האדומות.', 6000); };
document.addEventListener('mousemove', ()=>{ showBar(); if(running) autoHide(); });
document.addEventListener('keydown', e=>{
  if($('edit').classList.contains('on')) return;
  if(e.code==='Space'){ e.preventDefault(); toggle(); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); $('speed').value=Math.min(120,+$('speed').value+4); $('speedv').textContent=$('speed').value; }
  else if(e.key==='ArrowDown'){ e.preventDefault(); $('speed').value=Math.max(8,+$('speed').value-4); $('speedv').textContent=$('speed').value; }
  else if(e.key==='Home'){ toTop(); }
  else if(e.key==='+' || e.key==='='){ $('size').value=+$('size').value+4; applySize(); }
  else if(e.key==='-'){ $('size').value=+$('size').value-4; applySize(); }
  else if(e.key.toLowerCase()==='r'){ toggleRec('audio'); }
  else if(e.key.toLowerCase()==='v'){ toggleRec('video'); }
});
window.addEventListener('resize', ()=>{ place(); markDone(); });
if(window.innerWidth < 820){ $('size').value = 40; }
buildPicker(); render(); place(); markDone();
</script>
</body>
</html>
